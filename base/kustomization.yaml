apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - database
  - exoplanets
secretGenerator: # it will add random suffix to the secret name
  - name: db-secret
    literals:
      - POSTGRESQL_PASSWORD=raj@123
      - DB_USER_PASSWORD=postgres
      - DB_NAME=redhat_db
      - DB_PASSWORD=raj@123

configMapGenerator:
  - name: db-config
    behavior: merge
    literals:
      - DB_HOST=dev
      - DB_PORT=5432